name: Jira PR Status Sync

on:
  pull_request:
    types: [opened, closed]

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip forks: they can't have access to the Jira secrets below.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine target status
        id: status
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "$ACTION" = "opened" ]; then
            echo "value=In Review" >> "$GITHUB_OUTPUT"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            echo "value=Ready for testing" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Move linked ticket(s)
        if: steps.status.outputs.value != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TARGET_STATUS: ${{ steps.status.outputs.value }}
        run: |
          printf '%s' "$PR_TITLE" | python .github/scripts/jira.py "$TARGET_STATUS"
